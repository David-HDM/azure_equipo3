<!DOCTYPE html>
<!-- ARCHIVO DE: Alejandra (frontend) -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de alumnos</title>

  <link rel="icon" href="favicon.png" type="image/png">

  <!-- NO MODIFICAR: enlace a los estilos -->
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- Aquí empieza el codigo de Alejandra -->
  <main class="contenedor">
    <h1>Registro de alumnos</h1>

    <form id="formulario">
      <input type="hidden" id="id">

      <div class="campo campo-nombre">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" required>
      </div>

      <div class="campo campo-calificacion">
        <label for="calificacion">Calificación</label>
        <input type="number" id="calificacion" min="0" max="10" step="0.1" required>
      </div>

      <button type="submit">Guardar</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Calificación</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla"></tbody>
    </table>
  </main>
  <!-- Aquí termina el código de Alejandra -->

  <!-- NO MODIFICAR: enlace al código del navegador -->
  <script src="programa.js"></script>
</body>
</html>
